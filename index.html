<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav class="navigation">
            <img src="https://cdn-icons-png.flaticon.com/128/3626/3626508.png" alt="Calculadora" width="30" height="30">
            <a href="https://github.com/italosouzatech/Calculator">Projeto</a>
            <img src="https://cdn-icons-png.flaticon.com/128/733/733609.png" alt="GitHub" width="30" height="30">
            <a href="https://github.com/italosouzatech" target="_blank">Portfólio</a>
        </nav>
    </header>
    <div class="calculadora">
        <div>
            <p id="resultado">0</p>
        </div>
        <table>
            <tr>
                <td><button class="operador" onclick="clean()">C</button></td>
                <td><button class="operador" onclick="apagar()">←</button></td>
                <td><button class="operador" onclick="adicionarOperador('/')">/</button></td>
                <td><button class="operador" onclick="adicionarOperador('*')">*</button></td>
            </tr>
            <tr>
                <td><button class="botao" onclick="adicionarNumero('7')">7</button></td>
                <td><button class="botao" onclick="adicionarNumero('8')">8</button></td>
                <td><button class="botao" onclick="adicionarNumero('9')">9</button></td>
                <td><button class="operador" onclick="adicionarOperador('-')">-</button></td>
            </tr>
            <tr>
                <td><button class="botao" onclick="adicionarNumero('4')">4</button></td>
                <td><button class="botao" onclick="adicionarNumero('5')">5</button></td>
                <td><button class="botao" onclick="adicionarNumero('6')">6</button></td>
                <td><button class="operador" onclick="adicionarOperador('+')">+</button></td>
            </tr>
            <tr>
                <td><button class="botao" onclick="adicionarNumero('1')">1</button></td>
                <td><button class="botao" onclick="adicionarNumero('2')">2</button></td>
                <td><button class="botao" onclick="adicionarNumero('3')">3</button></td>
                <td rowspan="2"><button class="igual operador" onclick="calcular()">=</button></td>
            </tr>
            <tr>
                <td colspan="2"><button class="espaço" onclick="adicionarNumero('0')">0</button></td>
                <td><button class="operador" onclick="adicionarOperador('.')">.</button></td>
            </tr>
        </table>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
